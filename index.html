<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gladiator Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .log-scroll::-webkit-scrollbar { width: 6px; }
        .log-scroll::-webkit-scrollbar-track { background: #1f2937; }
        .log-scroll::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-amber-600/30 py-3 px-6 shadow-lg z-20">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="font-cinzel text-2xl font-extrabold tracking-wider text-amber-500">3D GLADIATOR ARENA</h1>
                <p class="text-xs text-gray-400 tracking-widest uppercase">Autonomous 3D Autobattler</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="toggleSimBtn" onclick="toggleSimulation()" class="bg-amber-600 hover:bg-amber-500 text-gray-950 font-bold px-5 py-2 rounded shadow transition flex items-center gap-2 text-sm">
                    <svg id="btnIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <span id="btnText">Start Simulation</span>
                </button>
                <button onclick="resetTournament()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold px-4 py-2 rounded border border-gray-700 transition text-sm">
                    New Gear / Draft
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
        
        <!-- Left Column: Fighters Overview -->
        <section class="lg:col-span-1 flex flex-col gap-4">
            <div class="bg-gray-900/90 backdrop-blur border border-gray-800 rounded-xl p-4 shadow-xl">
                <h2 class="font-cinzel text-base font-bold text-amber-400 mb-3 border-b border-gray-800 pb-2">The Gladiators</h2>
                <div id="fightersContainer" class="flex flex-col gap-3">
                    <!-- Dynamic Fighter Cards -->
                </div>
            </div>
        </section>

        <!-- Right/Center Columns: 3D Canvas & Log -->
        <section class="lg:col-span-2 flex flex-col gap-4">
            
            <!-- 3D Viewport Container -->
            <div class="bg-gray-900 border border-amber-600/30 rounded-xl shadow-2xl relative overflow-hidden flex flex-col h-[380px]">
                <div class="absolute top-3 left-3 z-10 bg-gray-950/80 border border-gray-800 px-3 py-1 rounded text-xs font-mono text-amber-400 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse" id="matchStatusIndicator"></span>
                    <span id="matchStateLabel">Arena Idle</span>
                </div>
                <div id="canvasContainer" class="w-full h-full cursor-grab"></div>
            </div>

            <!-- Live Combat Log -->
            <div class="bg-gray-900/90 backdrop-blur border border-gray-800 rounded-xl p-4 shadow-xl flex flex-col h-[200px]">
                <div class="flex justify-between items-center mb-2 border-b border-gray-800 pb-2">
                    <h2 class="font-cinzel text-xs font-bold text-amber-400 uppercase tracking-wider">Combat Log</h2>
                    <button onclick="clearLog()" class="text-[11px] text-gray-500 hover:text-gray-300 transition">Clear</button>
                </div>
                <div id="combatLog" class="log-scroll flex-grow overflow-y-auto flex flex-col gap-1 font-mono text-xs pr-2">
                    <div class="text-gray-500 italic">[System] 3D Engine initialized. Ready for battle.</div>
                </div>
            </div>

        </section>
    </main>

    <!-- Game Engine Script -->
    <script>
        // Item & Skill Datasets
        const WEAPONS = [
            { name: "Broadsword", dmg: 14, speed: 1.0, crit: 0.1, color: 0xc0c0c0 },
            { name: "War Axe", dmg: 19, speed: 0.8, crit: 0.15, color: 0x8b4513 },
            { name: "Spear", dmg: 12, speed: 1.2, crit: 0.08, color: 0xd4af37 },
            { name: "Warhammer", dmg: 24, speed: 0.65, crit: 0.2, color: 0x555555 }
        ];

        const ARMOR = [
            { name: "Iron Cuirass", armor: 8, hp: 30, color: 0x4a5568 },
            { name: "Plate Harness", armor: 13, hp: 45, color: 0x2d3748 },
            { name: "Gold Armor", armor: 10, hp: 35, color: 0xb7791f }
        ];

        const SKILLS = [
            { name: "Power Strike", cooldown: 4, effect: (f, e) => {
                let dmg = Math.round(f.calcDmg() * 1.5);
                e.takeDmg(dmg);
                return `${f.name} lands a heavy **Power Strike** for <span class="text-amber-400 font-bold">${dmg}</span> damage!`;
            }},
            { name: "Shield Slam", cooldown: 5, effect: (f, e) => {
                let dmg = 12 + f.armorValue;
                e.takeDmg(dmg);
                return `${f.name} executes a brutal **Shield Slam** for <span class="text-amber-400 font-bold">${dmg}</span> impact!`;
            }},
            { name: "Second Wind", cooldown: 7, effect: (f, e) => {
                let heal = 25;
                f.hp = Math.min(f.maxHp, f.hp + heal);
                return `${f.name} catches breath with **Second Wind**, recovering <span class="text-emerald-400 font-bold">${heal} HP</span>!`;
            }}
        ];

        class Gladiator {
            constructor(id, name, title, meshColor) {
                this.id = id;
                this.name = name;
                this.title = title;
                this.meshColor = meshColor;
                this.wins = 0;
                this.losses = 0;
                this.randomizeGear();
            }

            randomizeGear() {
                this.weapon = WEAPONS[Math.floor(Math.random() * WEAPONS.length)];
                this.armorPiece = ARMOR[Math.floor(Math.random() * ARMOR.length)];
                this.skill = SKILLS[Math.floor(Math.random() * SKILLS.length)];
                this.armorValue = this.armorPiece.armor;
                this.maxHp = 100 + this.armorPiece.hp;
                this.hp = this.maxHp;
                this.skillCd = 0;
            }

            calcDmg() {
                let base = this.weapon.dmg + Math.floor(Math.random() * 5);
                return Math.random() < this.weapon.crit ? Math.round(base * 1.75) : base;
            }

            takeDmg(raw) {
                let actual = Math.max(3, raw - Math.floor(this.armorValue * 0.5));
                this.hp = Math.max(0, this.hp - actual);
                return actual;
            }
        }

        // Setup Gladiators
        let gladiators = [
            new Gladiator(1, "Vane", "The Bloodsworn", 0xd97706),
            new Gladiator(2, "Valeria", "Iron Shield", 0x2563eb),
            new Gladiator(3, "Korrigan", "Shadow Edge", 0x7c3aed),
            new Gladiator(4, "Thorgar", "Mountain Crusher", 0xdc2626)
        ];

        let simActive = false;
        let matchCount = 0;
        let f1 = null, f2 = null;
        let simInterval = null;

        // --- THREE.JS 3D SCENE SETUP ---
        let scene, camera, renderer, mesh1, mesh2;

        function init3D() {
            const container = document.getElementById("canvasContainer");
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0c);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 8, 14);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffedd5, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Arena Floor (Circular Colosseum Base)
            const floorGeo = new THREE.CylinderGeometry(6, 6, 0.5, 32);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.25;
            scene.add(floor);

            // Arena Ring Edge
            const ringGeo = new THREE.TorusGeometry(6, 0.15, 16, 100);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xb45309 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);

            // Create 3D Fighter Meshes (Simple stylized blocks representing fighters)
            const boxGeo = new THREE.BoxGeometry(1.2, 2.2, 1.2);
            
            const mat1 = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
            mesh1 = new THREE.Mesh(boxGeo, mat1);
            mesh1.position.set(-2.5, 1.1, 0);
            scene.add(mesh1);

            const mat2 = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 });
            mesh2 = new THREE.Mesh(boxGeo, mat2);
            mesh2.position.set(2.5, 1.1, 0);
            scene.add(mesh2);

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            
            // Subtle idle floating / breathing animation if active
            if (simActive && mesh1 && mesh2) {
                mesh1.rotation.y += 0.01;
                mesh2.rotation.y -= 0.01;
            }

            renderer.render(scene, camera);
        }

        // UI & Game Loop Integration
        function initUI() {
            renderFightersList();
            setupNextMatch();
        }

        function renderFightersList() {
            const container = document.getElementById("fightersContainer");
            container.innerHTML = "";
            gladiators.forEach(f => {
                let card = document.createElement("div");
                card.className = "bg-gray-950/80 border border-gray-800 rounded-lg p-3 flex flex-col gap-1.5";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="font-bold text-sm text-gray-200">${f.name}</span>
                            <span class="text-[10px] text-amber-400/90 ml-2 italic">${f.title}</span>
                        </div>
                        <div class="font-mono text-xs"><span class="text-emerald-400">${f.wins}W</span> / <span class="text-red-400">${f.losses}L</span></div>
                    </div>
                    <div class="text-[11px] text-gray-400 flex gap-3">
                        <span>Wpn: <strong class="text-gray-300">${f.weapon.name}</strong></span>
                        <span>Armor: <strong class="text-gray-300">${f.armorPiece.name}</strong></span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setupNextMatch() {
            let i1 = Math.floor(Math.random() * gladiators.length);
            let i2;
            do { i2 = Math.floor(Math.random() * gladiators.length); } while (i2 === i1);

            f1 = gladiators[i1];
            f2 = gladiators[i2];

            f1.hp = f1.maxHp; f1.skillCd = 0;
            f2.hp = f2.maxHp; f2.skillCd = 0;

            // Update 3D mesh colors to match current fighters
            if(mesh1 && mesh2) {
                mesh1.material.color.setHex(f1.meshColor);
                mesh2.material.color.setHex(f2.meshColor);
            }

            logMessage(`[Bout] **${f1.name}** steps up against **${f2.name}** in the 3D Colosseum!`);
        }

        function toggleSimulation() {
            simActive = !simActive;
            const btnText = document.getElementById("btnText");
            const btnIcon = document.getElementById("btnIcon");
            const indicator = document.getElementById("matchStatusIndicator");
            const label = document.getElementById("matchStateLabel");

            if (simActive) {
                btnText.innerText = "Pause Sim";
                btnIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                indicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                label.innerText = "3D Simulation Active";
                simInterval = setInterval(runTick, 1000);
            } else {
                btnText.innerText = "Start Simulation";
                btnIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                indicator.className = "w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse";
                label.innerText = "Arena Paused";
                clearInterval(simInterval);
            }
        }

        function runTick() {
            if (!f1 || !f2) return;
            if (f1.hp <= 0 || f2.hp <= 0) { resolveMatch(); return; }

            // Combat turn
            executeAttack(f1, f2);
            if (f2.hp <= 0) { resolveMatch(); return; }

            setTimeout(() => {
                if (simActive && f1.hp > 0 && f2.hp > 0) {
                    executeAttack(f2, f1);
                    if (f1.hp <= 0) { resolveMatch(); }
                }
            }, 400);
        }

        function executeAttack(attacker, defender) {
            if (attacker.skillCd > 0) attacker.skillCd--;
            let msg = "";
            if (attacker.skillCd === 0 && Math.random() < 0.4) {
                msg = attacker.skill.effect(attacker, defender);
                attacker.skillCd = attacker.skill.cooldown;
            } else {
                let dmg = attacker.calcDmg();
                defender.takeDmg(dmg);
                msg = `${attacker.name} strikes ${defender.name} with ${attacker.weapon.name} for <span class="text-amber-400 font-bold">${dmg}</span> HP. (${defender.name}: ${defender.hp} HP left)`;
            }
            logMessage(msg);
        }

        function resolveMatch() {
            let winner = f1.hp > 0 ? f1 : f2;
            let loser = f1.hp > 0 ? f2 : f1;
            winner.wins++; loser.losses++; matchCount++;

            logMessage(`<span class="text-amber-400 font-bold">🏆 VICTORY:</span> **${winner.name}** wins the 3D arena bout!`);
            
            winner.randomizeGear();
            loser.randomizeGear();
            renderFightersList();

            setTimeout(() => { if (simActive) setupNextMatch(); }, 1500);
        }

        function logMessage(msg) {
            const log = document.getElementById("combatLog");
            let entry = document.createElement("div");
            entry.className = "border-l-2 border-amber-600 pl-2 py-0.5 text-gray-300";
            entry.innerHTML = msg;
            log.prepend(entry);
            if (log.children.length > 40) log.removeChild(log.lastChild);
        }

        function clearLog() {
            document.getElementById("combatLog").innerHTML = `<div class="text-gray-500 italic">[System] Feed cleared.</div>`;
        }

        function resetTournament() {
            simActive = false;
            clearInterval(simInterval);
            document.getElementById("btnText").innerText = "Start Simulation";
            document.getElementById("matchStateLabel").innerText = "Arena Idle";
            gladiators.forEach(f => { f.wins = 0; f.losses = 0; f.randomizeGear(); });
            initUI();
            logMessage(`<span class="text-cyan-400">[System]</span> Tournament reset.`);
        }

        window.onload = () => { init3D(); initUI(); };
        window.onresize = () => {
            const container = document.getElementById("canvasContainer");
            if(camera && renderer) {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        };
    </script>
</body>
</html>
